name: send-me-the-log
services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must contain the approved GHCR digest}
    platform: linux/amd64
    container_name: send-me-the-log
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    stop_grace_period: 150s
    environment:
      Tls__Enabled: "true"
      Tls__Domain: ${TLS_DOMAIN:?TLS_DOMAIN is required}
      Tls__HttpPort: ${APP_HTTP_PORT:-8080}
      Tls__HttpsPort: ${APP_HTTPS_PORT:-8443}
      ReverseProxy__Enabled: "false"
      ASPNETCORE_URLS: http://+:${APP_HTTP_PORT:-8080}
    ports:
      - "0.0.0.0:80:${APP_HTTP_PORT:-8080}"
      - "0.0.0.0:443:${APP_HTTPS_PORT:-8443}"
    volumes:
      - type: bind
        source: /opt/send-me-the-log/app/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/send-me-the-log/traffic-monitor/status
        target: /app/monitor-status
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/send-me-the-log/tls/acme
        target: /app/acme
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/send-me-the-log/tls/served
        target: /app/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/send-me-the-log/app/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/send-me-the-log/app/tmp
        target: /app/tmp
        bind:
          create_host_path: false
    labels:
      - "io.github.${REPOSITORY_OWNER:?REPOSITORY_OWNER is required}.application=send-me-the-log"
      - "io.github.${REPOSITORY_OWNER:?REPOSITORY_OWNER is required}.deployment-run=${DEPLOY_RUN:?DEPLOY_RUN is required}"
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
